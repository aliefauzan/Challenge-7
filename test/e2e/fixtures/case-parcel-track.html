<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Track your parcel</title>
<style>body{font:16px/1.5 -apple-system,system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 20px;color:#1d1d1f}h1{font-size:26px}label{display:block;margin:12px 0 4px;font-weight:600}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #c7c7cc;border-radius:8px;font:inherit}button{margin-top:16px;padding:10px 18px;border:0;border-radius:8px;background:#0071e3;color:#fff;font:inherit}.note{color:#6e6e73;font-size:14px}</style></head>
<body>
  <h1>Track your parcel</h1>
  <p>Enter your tracking number to see where your parcel is.</p>
  <form onsubmit="return false">
  <label>Tracking number</label>
  <input type="text">
  <label>Email or phone number (optional, for delivery updates)</label>
  <input type="text">
  <button>Track</button>
  </form>
  <p>Your parcel is out for delivery today between 10:00 and 14:00.</p>
  <p class="note">We never ask for payment to deliver a parcel.</p>
</body>
</html>
